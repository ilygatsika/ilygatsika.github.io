# The URL the site will be built for
base_url = "https://ilygatsika.github.io"
title = "Ioanna-Maria Lygatsika's website"
description = "A personal website to share my work and research activities"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "zola-bearblog"

default_language = "en"

[translations]
no_posts = "No posts yet"
remove_filter = "Remove filter"
filtering_for = "Filtering for"
made_with = "Made with"
table_of_contents = "Table of contents"
language = "language"
site = "site"

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
favicon="/favicon.png"

[[extra.main_menu]]
name = "Home"
url = "@/_index.md"

[[extra.main_menu]]
name = "Research"
url = "@/research.md"

[[extra.main_menu]]
name = "Publications"
url = "@/publications.md"

[[extra.main_menu]]
name = "Codes"
url = "@/codes.md"

[[extra.main_menu]]
name = "Teaching"
url = "@/teaching.md"
